server.port=8080

# Conexión a MySQL de XAMPP (crea megagames_db automáticamente)
spring.datasource.url=jdbc:mysql://localhost:3306/megagames_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate (crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave secreta para firmar los tokens JWT
jwt.secret=MegaGamesSuperSecretKeyParaEva3DSY1104_2026!
jwt.expiration=86400000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html